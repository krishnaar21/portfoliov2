<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:Inter,sans-serif;background:#050706;overflow:hidden}
.c{position:relative;width:1200px;height:630px;background:radial-gradient(70% 95% at 76% 55%,#0d7a4f 0%,#06402a 38%,#050706 75%);color:#fff}
.lg{position:absolute;left:48px;top:44px;display:flex;align-items:center;gap:14px;font-size:27px;font-weight:600;letter-spacing:-.01em}
.lg img{width:58px;height:58px;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.pl{position:absolute;left:48px;top:168px;background:#3fcf98;color:#04140d;font-weight:600;font-size:15px;letter-spacing:.06em;padding:8px 18px;border-radius:99px}
h1{position:absolute;left:46px;top:222px;font-size:74px;line-height:1.04;font-weight:700;letter-spacing:-.03em}
.sub{position:absolute;left:48px;top:410px;font-size:21px;color:rgba(255,255,255,.72)}
.row{position:absolute;left:48px;top:488px;display:flex}
.row span{width:68px;height:68px;border-radius:50%;overflow:hidden;border:3px solid #3fcf98;margin-right:-12px;background:#111}.row img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:50% 24%}
.tile{position:absolute;right:56px;top:56px;width:440px;height:518px;border-radius:26px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12)}
.tile img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.live{position:absolute;left:18px;top:18px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);font-size:13px;font-weight:600;letter-spacing:.08em;padding:7px 12px 7px 26px;border-radius:99px}
.live:before{content:"";position:absolute;left:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#3fcf98}
.talk{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;white-space:nowrap;padding:15px 30px;border-radius:99px;background:rgba(6,30,20,.72);backdrop-filter:blur(10px);border:2px solid #3fcf98;box-shadow:0 0 28px rgba(63,207,152,.45);font-size:21px;font-weight:600}
.talk svg{width:26px;height:26px}
</style></head><body><div class="c">
<div class="lg"><img src="logo.svg" alt="">TruGen AI</div>
<span class="pl">LAUNCHING</span>
<h1>Conversational<br>Video Agents</h1>
<p class="sub">with expressive human-like faces</p>
<div class="row"><span><img src="tg-av-priya.webp"></span><span><img src="tg-av-matt.webp"></span><span><img src="tg-av-aman.webp"></span><span><img src="tg-av-lisa.webp"></span><span><img src="tg-av-chloe.webp"></span><span><img src="tg-av-sameer.webp"></span></div>
<div class="tile"><img src="lisa.jpg" alt=""><span class="live">LIVE</span><span class="talk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5 21 7.5v9l-5.5-3z"/></svg>Talk to Lisa</span></div>
</div></body></html>
