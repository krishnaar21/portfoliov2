<span class="mono ick">Interview Cracker · Case study</span>
<h1 class="ich">What if your next interview started with <span>everything in place?</span></h1>
<p class="icsub">Connecting resume preparation, AI-assisted interviews, and recruitment operations.</p>
<div class="icspec"><div><span class="mono">Industry</span>Career tech · Recruitment</div><div><span class="mono">Role</span>${A.role}</div><div><span class="mono">Design team</span>Solo designer</div><div><span class="mono">Timeline</span>Until May 2026</div><div><span class="mono">Platform</span>Web</div><div><span class="mono">Status</span><span class="icok icwip">Pre-launch</span></div></div>
<aside class="icnt"><span class="mono">A note on the name</span><p>Interview Cracker is an internal product, and the name is a working title. It was built for internal use, with a plan to make it available to the public. When I left in May 2026 it was in its final stages of development.</p></aside>
${fig("lead","Lead visual","16/9")}
<section class="csec"><h3>Overview</h3><p>Getting hired involves more than the interview itself. There are resumes to prepare, roles to understand, sessions to schedule, and follow-ups to manage.</p><p>Interview Cracker brings these activities into one workspace. Candidates can create and tailor resumes and access AI-assisted interview sessions. Recruitment teams can manage the work around those sessions, from candidate submissions to placements.</p><p>As the sole Product Designer, I designed the experience across both sides of the product. By the time I left in May 2026, the product was in its final stages of development, covering the core workflows alongside team management, billing, account settings, and support.</p>
<div class="icjr" role="list">${[[1,"Before","Prepare","Resumes created, imported and tailored to a role."],[2,"During","Interview","A live workspace for responses and transcripts."],[3,"After","Follow through","Submissions, interviews and placements, tracked."]].map(([n,m,b,p])=>`<button type="button" class="icjs" role="listitem" data-icgo="ic-c${n}"><span class="icdot">0${n}</span><span class="mono">${m}</span><b>${b}</b><p>${p}</p></button>`).join("")}</div></section>
<section class="csec"><span class="mono ick">The challenge</span><h3>One product. Different kinds of focus.</h3><p>Preparing a resume is deliberate. Following an interview happens in real time. Managing a recruitment pipeline means reviewing many people and details at once. The challenge was to connect these activities without treating them as the same task.</p>
<div class="icfm"><div><div class="icviz icdoc" aria-hidden="true"><div class="icpg"><span class="av"></span><span class="nm"></span><span class="l l1"></span><span class="l l2"></span><span class="l l3"></span><span class="l l4"></span></div><span class="ictag">✓ Tailored</span></div><b>Preparation</b><p>Creating resumes and adapting them to a role.</p></div><div><div class="icviz iclive" aria-hidden="true"><span class="iclv">Live</span><span class="icwv">${"<i></i>".repeat(26)}</span><span class="icbub"><i></i><i></i></span></div><b>Interview sessions</b><p>Bringing responses, transcripts, and connection information together.</p></div><div><div class="icviz ictbl" aria-hidden="true"><div class="ictk2">${[["s","Submitted"],["i","Interview"],["p","Placed"],["i","Interview"],["s","Submitted"],["p","Placed"],["s","Submitted"],["i","Interview"],["p","Placed"],["i","Interview"]].map(([c,l])=>`<span class="icr"><i class="a"></i><i class="n"></i><em class="${c}">${l}</em></span>`).join("")}</div></div><b>Recruitment operations</b><p>Tracking candidates, responsibilities, and next steps.</p></div></div>
<p class="ichmw"><span class="mono ick">How might we</span>keep the hiring journey connected while giving each task the focus it needs?</p></section>
<section class="csec"><span class="mono ick">Who it’s for</span><h3>Three perspectives on the same journey.</h3>
<div class="icwho"><div><span class="icav" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></svg></span><b>Candidates</b><p>Preparing their information, setting up sessions, and using the interview workspace.</p>${st(["Before","During"])}</div><div><span class="icav" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="12.5" rx="2.2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3.5 12.5h17"/></svg></span><b>Recruiters</b><p>Coordinating candidates, maintaining interview records, and tracking progress toward placement.</p>${st(["During","After"])}</div><div><span class="icav" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="9" r="2.8"/><circle cx="16" cy="9" r="2.8"/><path d="M3 19a5.5 5.5 0 0 1 11 0M12.5 15.2A5.5 5.5 0 0 1 21 19"/></svg></span><b>Team leads and administrators</b><p>Reviewing activity across the team and managing members, reporting relationships, and permissions.</p>${st(["After"])}</div></div>
<p class="icnote">These perspectives share information, but they do not need the same interface at every moment.</p></section>
${chap(1,"Preparation")}
${sol(1,1,"Make the starting point obvious.","The interview home brings the primary actions together: start a live interview, schedule a session, or enter the phone interview flow.","Different interview modes need clear entry points, while an ongoing session needs to remain easy to recover.",[["Labelled entry points","Separate the main actions into labelled cards."],["The active session, up front","Surface the active session with return and end actions."],["Status-led history","Keep previous interviews in a status-led history table."]],"Starting something new should not mean losing track of what is already happening.",fig("home","Interview home","16/10","Interview home: three ways in, with the active session close at hand"))}
${sol(2,1,"Start with what you already have.","Some candidates arrive with a finished resume. Others have a LinkedIn profile, an older document, or nothing prepared.","A single creation flow would force different starting points through the same process.",[["Three ways in","Offer separate paths for creating, uploading, and importing a resume."],["Tailoring is its own task","Make job-specific tailoring and single-page conversion distinct tasks."],["Edit in sections, with a preview","Structure editing into personal details, experience, education, skills, and summary, alongside a preview."]],"The product should build on someone’s existing work, not make them repeat it.",`<div class="icfig2">${fig("resumes","Resume workspace","4/3","Create, upload or import")}${fig("editor","Resume editor","4/3","Sections alongside a preview")}</div>`)}
${sol(3,1,"Keep the next step clear when something fails.","Resume importing and tailoring include moments when the system is fetching or processing information. Those moments need as much consideration as the completed result.","Waiting creates uncertainty. An unsuccessful import can stop the task unless there is another route.",[["Three clear steps","Break tailoring into choosing a resume, entering a job description, and downloading the result."],["Every state shown","Show processing, completion, and failure states."],["A manual fallback","Allow manual job-description entry when a link cannot be processed."],["Retry or start fresh","Provide retry and create-from-scratch options when a LinkedIn import fails."]],"A failed import should change the route, not end the journey.",`<div class="icflow" aria-label="Tailoring flow with processing, complete and failed states"><span class="mono">Tailoring, step by step</span><ol class="icstp"><li><u></u><span class="mono">Step 1</span><b>Choose a resume</b><small>From saved resumes</small></li><li><u></u><span class="mono">Step 2</span><b>Add the job description</b><small>Paste a link or the text</small></li><li><u></u><span class="mono">Step 3</span><b>Download the result</b><small>A tailored copy</small></li></ol><div class="icsts"><div class="icsc p"><span class="ichd"><span class="icspin" aria-hidden="true"></span><b>Processing</b></span><p>Reading the job description…</p><span class="icsk" aria-hidden="true"><i></i><i></i><i></i></span></div><div class="icsc d"><span class="ichd"><span class="icico" aria-hidden="true">✓</span><b>Complete</b></span><p>Your tailored resume is ready.</p><span class="icbtn pri">Download PDF</span></div><div class="icsc f"><span class="ichd"><span class="icico" aria-hidden="true">!</span><b>Failed</b></span><p>We couldn’t read that link. Try another route.</p><span class="icbtns"><span class="icbtn pri">Enter it manually</span><span class="icbtn">Retry</span></span><small>LinkedIn import failed? Retry, or create from scratch.</small></div></div></div>${fig("tailor","Auto-tailor and import states","16/9","Processing, completion and failure, each with a next step")}`)}
${chap(2,"Conversation")}
${sol(4,2,"Give the interview room to breathe.","The session workspace separates the primary copilot area from supporting connection information and the candidate transcript.","Several information streams need to coexist without competing equally for attention.",[["Copilot takes the centre","Give copilot responses the main workspace."],["Context on the side","Keep connection information and the transcript in a supporting column."],["Empty states that explain","Explain empty states before the meeting is connected."],["Controls always in view","Keep session controls visible in the header."]],"A real-time workspace should make its current state understandable at a glance.",`<div class="icws" aria-label="Layout of the interview workspace"><div class="h"><b>Session header</b><span><i class="on">Live</i><i>End session</i></span></div><div class="m"><b>Copilot responses</b>The main workspace, where answers appear as the interview happens.<div class="ln"></div><div class="ln"></div><div class="ln"></div></div><div><b>Connection</b>Meeting status, with an explained empty state before it connects.</div><div><b>Candidate transcript</b>Follows the conversation in a supporting column.</div></div>${fig("room","Live interview session","16/10","The active session: copilot first, context alongside")}`)}

${sol(5,3,"Follow the candidate beyond the interview.","For recruitment teams, the interview is one stage in a longer process. Submissions, interviews, and placements each require their own details.","A single undifferentiated record would mix information needed at different stages.",[["A view per stage","Separate tracking into submissions, interviews, and placements."],["Stage-specific fields","Use stage-specific fields for job details, feedback, joining information, and paperwork."],["Filters that narrow fast","Add filters for timeframe, candidates, and members."],["Built for teams","Support team organisation through reporting relationships and role permissions."]],"The tracker should reflect the work happening now while preserving the broader context.",`<div class="icpipe"><div><span class="mono">Stage 1</span><b>Submissions</b><span class="icchips"><span>Job details</span></span></div><div><span class="mono">Stage 2</span><b>Interviews</b><span class="icchips"><span>Feedback</span></span></div><div><span class="mono">Stage 3</span><b>Placements</b><span class="icchips"><span>Joining information</span><span>Paperwork</span></span></div><div class="icflt"><span class="mono">Filter by</span><span class="icchips"><span>Timeframe</span><span>Candidates</span><span>Members</span></span></div></div>${fig("tracker","Recruitment tracker","16/10","Submissions, interviews and placements, each with its own details")}`)}
<section class="csec"><span class="mono ick">The visual language</span><h3>Familiar structure, different levels of detail.</h3><p>A consistent sidebar connects the product’s different areas. Light surfaces and restrained borders organise the content, while pink highlights identify selected destinations and interactions.</p>
<div class="icsw"><div><span class="s1"></span><p>Consistent sidebar</p></div><div><span class="s2"></span><p>Light surfaces</p></div><div><span class="s3"></span><p>Restrained borders</p></div><div><span class="s4"></span><p>Pink highlights</p></div></div>
<div class="icden"><div class="bar" aria-hidden="true"></div><div class="lb"><div><b>Candidate screens</b>Clear actions, focused workspaces</div><div><b>Recruitment screens</b>Denser tables, filters, status labels</div></div></div>
<p class="icnote">Repeated patterns give these different surfaces a shared language without forcing them into the same layout.</p>${fig("system","Screens side by side","16/9")}</section>
<section class="csec"><span class="mono ick">Outcome</span><h3>Where it landed.</h3><p>By May 2026 the product was in its final stages of development, across resume preparation, AI-assisted interview sessions, and recruitment operations. The designed scope included more than the main journeys.</p>
<div class="icout"><div><span class="mono">Core journeys</span><ol><li>Resume preparation</li><li>AI-assisted interview sessions</li><li>Recruitment operations</li></ol></div><div><span class="mono">Beyond the happy path</span><span class="icchips">${["Empty states","Processing states","Import failures","Recovery paths","Confirmations","Subscription limits","Team permissions","Billing","Support"].map(c=>`<span>${c}</span>`).join("")}</span></div></div>
<p class="icnote">The result is a connected product experience spanning the work before, during, and after an interview.</p></section>
<section class="csec"><span class="mono ick">Looking back</span><h3>Breadth versus focus.</h3><p>Candidates, recruiters, and administrators work with related information, but need different levels of detail. The design separates their tasks while maintaining a consistent structure across the product.</p><p class="icq">Connect the journey without putting the entire journey on every screen.</p></section>
<section class="iccn"><span class="mono ick2">Preparation, conversation, and follow-through.</span><h3>One workspace for the work around an interview.</h3><span class="mono">Takeaways</span><div class="ictk"><div><span class="mono">01</span><b>Organise around the task.</b><p>Preparation, live sessions, and recruitment tracking need different kinds of focus.</p></div><div><span class="mono">02</span><b>Design beyond the happy path.</b><p>Waiting, failure, recovery, and returning to an active session are part of the core experience.</p></div><div><span class="mono">03</span><b>Give AI a clear place.</b><p>Generated content needs to sit within an understandable workflow, alongside the context and controls people need.</p></div></div></section>
<div class="next"><a href="#/work" class="mono">← All work</a><a href="#/p/${e.id}">${e.title} →</a></div></div>`}

<section class="csec"><h3>Overview</h3><p>Shellf is my side project: an app to keep every link I collect from the internet in one place. It’s a web app, still in progress, that works on a phone, an iPad and a computer. Paste a link and Shellf fetches its preview and logo. Give it a name and tags, then find it again by describing what you need.</p>

<section class="csec"><span class="mono">THE APP</span><h3>One calm home for everything you save.</h3><p>The UI stays quiet and neutral, so the saved sites’ own logos and images do the colouring.</p>
<div class="tms xn nsh nsg">${sc("home","Home: Overview with link counts, broken links, imports and duplicates, then Suggested for you","Home at a glance")}${sc("links","Links tab grouped by day, each row with the site logo","Links, by day")}${sc("search","Search for design: seven matching links with the word highlighted","Search as you type")}${sc("icons","App icon sheet: Graphite picked, with coloured and metallic styles","Pick an app icon")}</div>
<ul class="nsl"><li><b>Search that understands you.</b> Describe what you need in your own words. Shellf learns from the links you open, only on your device.</li><li><b>Spots copied links.</b> Copy a link anywhere and Shellf offers to save it.</li><li><b>Your links stay yours.</b> Everything lives on your device, with backups to your own Google Drive or iCloud, or to a file.</li><li><b>Make it yours.</b> Light and dark, list or card view, and a choice of app icon styles.</li><li><b>Try before signing up.</b> A demo mode with sample links, and sign-in with Google or email when you’re ready.</li></ul></section>

<h1 class="ct tmh">What if you loved<br> your booking app?</h1>
<div class="meta4"><div><span class="mono">Industry</span>Beauty and salons</div><div><span class="mono">Role</span>${A.role}</div><div><span class="mono">Team</span>Krishna AR, Sindhuri G</div><div><span class="mono">Platform</span>Web and mobile</div></div>
<section class="csec"><h3>Overview</h3><p>BookJoy is an online appointment system for beauty salons, with separate views for owners and staff. LashJoy, which has trained hundreds of new salon owners across Australia, asked us to redesign it. I designed the salon side, on web and mobile, working with Sindhuri G and the team at Quantana from September 2019 to April 2020.</p>${dk("cal_new","The redesigned BookJoy calendar: five stylists, classes, bookings and breaks in one day view")}</section>
<section class="csec"><span class="mono">RESEARCH</span><h3>Learning the salon’s day before redrawing it.</h3><p>This was my first full UX and UI project. I audited the current system, talked with the team and read the client’s notes on what staff liked, disliked and did every day. To understand salon scheduling, we also researched the booking experience on Acuity Scheduling, Timely and Fresha.</p><div class="bjcp"><span>Acuity Scheduling</span><span>Timely</span><span>Fresha</span></div><div class="tmrf bjtl"><div class="g"><span class="mono">Keep</span><b>What staff love today</b><p>Habits worth protecting in the redesign.</p></div><div class="y"><span class="mono">Gap</span><b>What competitors miss</b><p>Room for BookJoy to stand out.</p></div><div class="r"><span class="mono">Fix</span><b>UI and UX pain points</b><p>Where the current system slows staff down.</p></div></div>${BJI_has("research")?stage("bh0",dk("research","Research findings sorted by keep, gap and fix"),"A few points from the research and the client brief."):""}</section>
<section class="csec"><span class="mono">THE PROBLEM</span><h3>Too many clicks for a busy front desk.</h3><p>The old system took too many clicks, the screens were cluttered, and essential features had been traded away.</p><div class="tmrf"><div><span class="mono">01</span><b>Respect real hours.</b><p>Salons and staff keep different hours, with exceptions. Bookings must land inside them.</p></div><div><span class="mono">02</span><b>Book the way salons sell.</b><p>Multi-service bookings, products and rescheduling were missing.</p></div><div><span class="mono">03</span><b>Show the business.</b><p>Owners need staff availability, services, products sold and revenue at a glance.</p></div></div><div class="bjhm"><span class="mono">How might we</span><b>…make a booking system that makes you feel good?</b><p>The details page hid the last booked service and the wallet balance, and checking a booking’s payments, notes and history meant visiting page after page. The goal was an intuitive tool for staff to manage customers and book services.</p></div><div class="jump"><div><b>Short on time?</b><span>Skip straight to the solutions.</span></div><a class="btn" data-jump="b1" href="#/p/${A.id}">Show me the screens</a></div></section>
<section class="csec"><span class="mono">WHO IT’S FOR</span><h3>Three people, one appointment.</h3><div class="bjps"><div><b>Salon owner</b><span>Runs the business: staff hours, inventory, payments and the day’s in and out.</span></div><div><b>Salon staff</b><span>Schedules and changes appointments, and talks to customers.</span></div><div><b>Customer</b><span>Books from the salon’s own website.</span></div></div><p class="xnnote">Owners who work alone see both the admin and the staff screens. The core journey: make a booking (salon, staff, date and payment method), then manage it quickly later.</p></section>
${ft(1,"b1","Onboarding that explains itself.","Owners used to fill in a short Google form without knowing how BookJoy would help them, then landed on screens with no hierarchy and several competing primary buttons.",["A form with no sense of what came next.","Too much information, too many primary actions."],["A step-by-step signup: pick a plan, then add the salon.","Related fields grouped, with one pattern throughout."],"The first minutes set an owner’s trust in the whole system.","bh1",`<div class="bjp2 bjob">${fl("bj_before","Mobile onboarding before sign-up: intro slides, choose a plan, sign up","Before sign-up",["Intro","Plan","Sign up"])}${fl("bj_after","Mobile onboarding after sign-up: welcome, setup checklist, calendar tips and home","After sign-up",["Welcome","Checklist","Tips"])}</div>`,"The mobile onboarding, from the first screen to a ready salon.")}
${ft(2,"b2","A dashboard and a calendar that answer questions.","The old screens showed data without context. The redesign brings the numbers owners ask about, and the actions staff need, to the screens they already open.",["No quick view of how the salon was doing.","Bookings couldn’t be read or changed from the calendar."],["30-day analytics: top services, stylists, customers, products and revenue.","Calendar by stylist, with status changes and details inline."],"Owners and staff open these two screens all day, so every saved click repeats.","bh0",vs("dash_old","dash_new","dashboard","Dashboard")+vs("cal_old","cal_new","calendar","Calendar"),"Drag the handle to compare the old and new screens.")}

${ft(4,"b4","Reschedule without starting over.","To move a booking, staff had to cancel it and create a new one, which caused errors and duplicates.",["Cancel and rebook to change a date.","Duplicate bookings."],["The clipboard: hold a booking, then drop it on a new slot.","Cancelling changes the status and moves any prepaid amount to the customer’s wallet."],"A change of plan shouldn’t mean re-entering the booking.","bh0",`<div class="bjp4">${mb("m_drop","Dragging a booking to the clipboard tray: Drop your booking here to hold","Long press for tray")}${mb("m_clip","Clipboard tray holding two bookings","Hold on the clipboard")}${mb("m_clipopen","Clipboard opened, showing the held bookings ready to drop on a new slot","Drop on a new slot")}${mb("m_resch","Reschedule screen with booking date, services and products","Confirm the change")}</div>`,"On mobile: hold bookings on the clipboard, then drop them on a new date.")}
${ft(5,"b5","Classes from a template.","Salons run training classes for groups. There were no reusable templates, and editing a class was painful. This part was still in progress when work paused.",["Every class built from scratch.","Hard to edit once created."],["Class templates to reuse.","Invited students register and pay upfront."],"Repeated work should be set up once.","bh4",car("bh4",[["class","Schedule Class: class details, price, deposit and schedule","Schedule a class"],["invite","Invite Participants: pick a class and invite contacts","Invite participants"],["classbk","Class Bookings: participants, payments and status","Track class bookings"]]))}
<section class="csec" id="b6"><span class="mono">NEW FEATURES</span><h3>What competitors were missing.</h3><p>Alongside the fixes, we added features that save time at the front desk.</p>
${sub("Multi-service bookings and products","One customer, several services and products, on the same day with different staff, in a single booking.",car("bh0",[["fab","Add menu on the calendar: service booking, class booking or product sale","Start from the calendar"],["nb_empty","New booking: add a service, stylist and time","Add services"],["nb_fill","New booking with two services and a product","Services and products together"],["nb_sum","New booking with the customer summary: last service, wallet and no-shows","Customer context while booking"]],"Services, products and the customer’s history in one booking."))}
${sub("Move bookings between staff","Drag a booking to another stylist on the same day, or hold it on the clipboard to switch dates and staff. The app teaches both with short tips.",stage("bh1",`<div class="bjp2">${mb("o_t3","Tip: drag and move bookings between staff on the same date","Drop between staff")}${mb("o_t4","Tip: tap and hold a booking to drop it on the clipboard","Hold to clip a booking")}</div>`))}

${sub("More ways to pay","Staff could only take prepaid bookings. Now they can mark a booking Unpaid, Cash, POS or Deposit.",`<div class="bjpy"><span>Unpaid</span><span>Cash</span><span>POS</span><span>Deposit</span></div>`+stage("bh3",dk("checkout","Checkout with deposits, discounts, wallet balance and payment mode"),"Checkout: deposit or balance, wallet credit and the payment mode."))}
<div class="bjsub"><h4>And more we built</h4><div class="tmrf bjmore"><div><span class="mono">Customers</span><b>A customer booking flow</b><p>Customers book and pay from the salon’s own booking page.</p></div><div><span class="mono">Admin</span><b>Product add-ons</b><p>Admins attach products to services as add-ons.</p></div><div><span class="mono">Bookings</span><b>Merge bookings</b><p>Separate bookings for one customer combine into one.</p></div></div><p class="xnnote">…and many more features and tools for the front desk.</p></div>
</section>
<section class="csec"><span class="mono">ON THE GO</span><h3>The salon in a pocket.</h3><p>Owners and staff are rarely at a desk, so the mobile app keeps the calendar and the day’s numbers close.</p>${stage("bh0",`<div class="bjp2">${mb("m_cal","Mobile calendar with stylist columns, a class and breaks","Calendar")}<figure class="tmf"><div class="tph">${bar("m_home").replace("bjsb","bjsb on")}<div class="bjsc" tabindex="0" title="Scroll">${src("m_home","Mobile home: revenue, customers, recent bookings and visits")}</div></div><figcaption>Home (scroll inside)</figcaption></figure></div>`)}</section>
<section class="csec"><span class="mono">MORE SCREENS</span><h3>A few more from the system.</h3>${car("bh2",[["stylist","Day view for one stylist with today’s bookings, free time and breaks","One stylist’s day"],["week","Week view of a stylist’s bookings and breaks","Week view"],["month","Month view with daily revenue and booked versus free time","Month view"],["customers","Customers list with more filters: tags, salon, total spent and bookings","Customer filters"]])}</section>
<section class="csec"><h3>Outcome</h3><p>The first beta shipped after six months. Salon owners told us the average number of clicks per screen dropped by more than 35%, and they liked how it looked. COVID-19 then closed salons and the client paused design and development. Today a few local salons still use BookJoy internally. It’s a never-ending project.</p></section>
<section class="csec"><h3>Looking back</h3><p>Not every iteration worked. Early versions of the client feedback and customer profile, the view and edit booking page, and the dashboard and calendar failed on accessibility, UI or UX. Fixing them taught me the most.</p></section>
<section class="bjcn"><div class="bjcm"><div class="bjdt"><span class="mono">Apr</span><b>2020</b></div><span class="bjst mono">Confirmed</span><h3>A booking system that makes you feel good.</h3><p>BookJoy now lets a salon book, move and get paid for appointments in fewer clicks, with the history to back every change.</p><span class="mono bjcl">Sep 2019 → Apr 2020 · Salon web and mobile</span></div><div class="bjcs"><span class="mono">What I took away</span><ol><li class="c1"><span class="mono">09:00</span><b>Talk to every stakeholder</b><span>Owners, staff and the client each came from a different background.</span></li><li class="c2"><span class="mono">10:30</span><b>Lay a solid foundation</b><span>A shared canvas made every later iteration easier.</span></li><li class="c3"><span class="mono">12:00</span><b>Learn the business</b><span>I didn’t expect a whole system built around lash treatments.</span></li></ol></div></section>

(()=>{let q=0;const GAP=12,LIM=.04,MINF=96,FC=.06;

const pack=(T,N,WIN,SKIP,LP,R,NZ)=>{const H=Array(N).fill(0),seg=[...Array(N)].map(()=>[]),st=Array(N).fill(0),rest=T.map(t=>({...t,ih:t.ih0}));let worst=0,pen=0,lp=-1,bad=0;const out=[],fill=[];

window.NOTEB={"designing-for-simplicity-in-complex-user-flows": "<p>I joined Peerlist’s 21-day design challenge to push my skills and connect with a passionate design community, and I finished all 21 days. Along the way I kept coming back to one question: how do you keep a complex flow simple?</p><h2>Simplifying complex user flows</h2><p>Many products have to handle intricate processes: booking a flight, setting up health or finance accounts, or filling in long forms with conditional logic. The challenge is to make these flows easy to move through without overwhelming people. That takes thoughtful design, empathy for the user, and a clear information hierarchy.</p><h3>1. Break the process into small steps</h3><p>Too much information at once overwhelms people. Break the journey into clear, bite-sized steps. In a flight booking flow, for example, let users finish the flight details before moving on to baggage or add-ons. This is progressive disclosure: it keeps people focused and reduces cognitive load and mistakes.</p><h3>2. Prioritise the key action</h3><p>Complex flows often offer many actions at once. Highlighting one primary action per screen helps people keep moving. In a healthcare app, for instance, make actions like “Select meal” or “Add medication” stand out so users don’t get lost in secondary options.</p><h3>3. Use clear labels and visual cues</h3><p>Consistent labels and visual cues guide people through multi-step flows. Clear headings, progress indicators and “Next” buttons give structure, and markers show where people are in the process. Icons need extra care: actions like refresh, sync and replace can look almost identical, so choose icons and assets that leave no doubt about what they do.</p><h3>4. Cut unnecessary choices</h3><p>Offer only the options that matter to the user right now. Don’t load every extra flight service at once; use conditional logic or personalisation to show options based on earlier choices, so the flow feels personal and efficient.</p><h3>5. Gather feedback and iterate</h3><p>Simplicity isn’t one-size-fits-all. Feedback shows where people get stuck or frustrated, and refining the design based on real behaviour is what makes a flow genuinely easier to use.</p><h2>Final thoughts</h2><p>Simplicity is an ongoing process. With every iteration, thoughtful choices make even the most complex flows feel intuitive. Design with empathy, guide people through each stage, and the journey becomes smoother for everyone.</p>", "happy-birthday-peerlist-ec8e934135a0": "<p>I’m Krishna, a product designer, and this is a short note on my experience with Peerlist on its first birthday.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*Y289PUv2CeII4hykDHfrIQ.png\" alt=\"\" width=\"3200\" height=\"1920\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h2>A little context</h2><p>Back in 2021, many people were worried about their health, their families and their jobs. Across the tech industry, a lot of people lost work during the pandemic and started turning their skills and passions into new opportunities.</p><h2>How Peerlist started</h2><p>In that same phase of learning and discovery, <a href=\"https://peerlist.io/designerdada\" target=\"_blank\" rel=\"noopener\">Akash</a> and <a href=\"https://peerlist.io/yogini\" target=\"_blank\" rel=\"noopener\">Yogini</a>, a couple from Pune, noticed a problem: it was hard to grow a professional network, find like-minded people to work with, and show your work in one place on existing platforms.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*HJfRp2jugq9peaZaCmUFdg.png\" alt=\"\" width=\"2708\" height=\"1090\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><p>That’s how Peerlist began, as a small side project that grew fast (<a href=\"https://blog.peerlist.io/from-side-project-to-startup-things-i-learned-in-a-year/\" target=\"_blank\" rel=\"noopener\">read their story</a>). It started as an “intern product” in 2021 and, after a remarkable first year, was promoted to a full-time product on its birthday, 5 August 2022.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*EY6RGavnUQ2gIkIveSf9Iw.png\" alt=\"\" width=\"2200\" height=\"988\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>Platforms Peerlist brings together on your profile.</figcaption></figure><p>Peerlist now helps professionals keep their proof of work in one place, pulling it in from many sources onto a single profile, while connecting them with peers and organisations. Everything is possible when you have a strong community and people who truly believe in what you do, and this is just the beginning.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*X6jZVsiLkwKMU88ueT91Gg.png\" alt=\"\" width=\"3200\" height=\"1288\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>Create your profile and connect with your network.</figcaption></figure><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*6AmYxZpOHFUwawELDB3-mQ.png\" alt=\"\" width=\"3200\" height=\"1288\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>With Peerlist Hire you can find people to work with.</figcaption></figure><h2>My favourite features</h2><h3>Add context</h3><p>Every post can carry a context, which keeps the platform free of spam and makes relevant posts easy to discover.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*im5O3N-oA1LCQMfDDZDVig.png\" alt=\"\" width=\"2708\" height=\"1090\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>Peers and lists</h3><ul><li>When two people follow each other, they become Peers.</li><li>Custom lists filter your timeline and connections, so you can find posts from the people you care about.</li></ul><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*traZNjo3KoYcC6rHdDqTxQ.png\" alt=\"\" width=\"2708\" height=\"1090\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>Analytics</h3><ul><li>Track your profile visits over time.</li><li>See stats for your projects, website, Medium and Calendly.</li></ul><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*iE7jPblzb6b2ty3jMp-eVQ.png\" alt=\"\" width=\"2708\" height=\"1090\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>Job board filters</h3><ul><li>Track every candidate who applied.</li><li>View matching profiles and shortlist the ones who fit the role.</li></ul><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*PoTYKJGQdULulyoIE7FiFg.png\" alt=\"\" width=\"2708\" height=\"340\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>Thumbnails</h3><p>A good product with good design always has a special place for me. The beautiful auto-generated thumbnails for profiles, books, events and blog posts across the platform are proof.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*zwllJDnDTsZFnt6Ii72_FQ.png\" alt=\"\" width=\"2708\" height=\"1090\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>Auto-generated thumbnails for shared events and books.</figcaption></figure><p>You can find me on Peerlist at <a href=\"https://peerlist.io/krishnaar21\" target=\"_blank\" rel=\"noopener\">peerlist.io/krishnaar21</a>.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*CARruz2LmeqKgrCEIpElLA.png\" alt=\"\" width=\"3200\" height=\"1090\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>A proud moment: being one of the Super Peers.</figcaption></figure>", "two-things-from-my-childhood-that-made-me-realize-in-my-20s-that-i-am-a-design-person-7f4be4d53744": "<p>Looking back, a couple of moments from my childhood were quietly telling me I was drawn to science, design and tech. Anything beautiful made me curious to try it myself and find out how it was made. Here are two of my favourite memories from school.</p><h2>Story 1: The hand-drawn postcard</h2><p>I was in 4th standard, studying in a hostel, and every New Year I sent postcards to friends and family. Everyone else wrote notes; I drew artwork on mine instead, which made people curious, and some even started making their own versions.</p><p>My very first postcard came back undelivered. I assumed you were only allowed to write on postcards and that I had used it the wrong way. Then a teacher pointed out that I had simply forgotten to write the “To” address.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*vlyVL5BDQ16GWnAnc4AhcA.png\" alt=\"\" width=\"1920\" height=\"1080\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>What those postcards used to look like. I wish I still had mine.</figcaption></figure><h2>Story 2: Two prizes for one competition</h2><p>After 6th standard I moved from the hostel to Hyderabad. Around then a friend in middle school introduced me to computers, and later to Photoshop and digital art.</p><p>In 10th standard, a nearby police department held its yearly competition for students from local schools, with essay writing, drawing and singing. Each art student picked a random topic. I got “Traffic”, which I had no idea how to draw, and a friend from the English-medium batch got “A river in the mountains”. (I studied in Telugu medium until 10th.)</p><p>After thinking for a while, I drew what I saw on my way to school every day: a busy junction with a few vehicles, people walking and small shops along the pavement. I finished in 40 minutes. My friend was stuck on his topic, which was easy for someone like me who practised mountain-and-river scenes in MS Paint, so I drew it for him. (Yes, we cheated.) His drawing won first prize and mine won second, so technically I won both. We had no cameras to save the artwork, so only the certificates are left, and I have my mom to thank for keeping them safe.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*5KyTElXehxV1mgtiXSPyMA.png\" alt=\"\" width=\"1784\" height=\"778\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>Certificates from 10th standard (left) and 7th standard (right).</figcaption></figure><p>There’s one more memory from 7th standard: a friend and I built a model of the Taj Mahal out of polystyrene for the school’s art and science fair and won second prize. These moments seem small now, but they’re how I slowly found my way to design tools, from MS Paint to Photoshop and Illustrator, and now Figma.</p><p>They are also why I chose design as a career, and I still love doing it.</p>", "websites-that-wowed-me-5d6e9145a80d": "<figure><img src=\"https://cdn-images-1.medium.com/max/800/1*13kC2daiFNbBRL7jT0tY_Q.jpeg\" alt=\"\" width=\"3840\" height=\"1914\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><p>Out of curiosity, I’ve made a habit of collecting interesting things I find online. I started by keeping them for myself, then began sharing them with the design and tech community. Here are a few websites I found unique and inspiring, purely from a creative point of view. Consider this a small thank-you to the people who made them.</p><blockquote>“When you’re curious, you find lots of interesting things to do.” — Walt Disney</blockquote><p>Tip: open them on a laptop, with sound on and a good connection. Some are heavy and may load slowly.</p><h2>The wow list</h2><h3>1. <a href=\"https://atmos.leeroy.ca/\" target=\"_blank\" rel=\"noopener\">atmos.leeroy.ca</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*u1m9dTAUHMvXU_hKsXfhIw.gif\" alt=\"\" width=\"800\" height=\"427\" loading=\"lazy\" decoding=\"async\" onerror=\"this.close "noopener\">artisansdidees.com</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*4-4TpZ8BBsNjSKICObgp7w.gif\" alt=\"\" width=\"960\" height=\"524\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>9. <a href=\"https://exp-gemini.lusion.co/\" target=\"_blank\" rel=\"noopener\">exp-gemini.lusion.co</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*z9P5uXOf-kOdDIEaKp-f6w.gif\" alt=\"\" width=\"960\" height=\"526\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>10. <a href=\"https://sakarisake.com/\" target=\"_blank\" rel=\"noopener\">sakarisake.com</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*O4kFYMFpYBhFienxJ85v8Q.gif\" alt=\"\" width=\"960\" height=\"528\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>11. <a href=\"https://block.xyz/\" target=\"_blank\" rel=\"noopener\">block.xyz</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*QvbG4-lZN1N2gumx2mL4_Q.gif\" alt=\"\" width=\"960\" height=\"524\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>12. <a href=\"http://savethesounds.info/\" target=\"_blank\" rel=\"noopener\">savethesounds.info</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*5TdGJFm8ooWe7uWc2fSzSQ.gif\" alt=\"\" width=\"960\" height=\"507\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>13. <a href=\"http://species-in-pieces.com/\" target=\"_blank\" rel=\"noopener\">species-in-pieces.com</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*baUN-9rV1Ok1RiOXZU1Fig.gif\" alt=\"\" width=\"960\" height=\"525\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>14. <a href=\"https://ferrumpipe.com/\" target=\"_blank\" rel=\"noopener\">ferrumpipe.com</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*zVGBjMlsvmLIiuUVZ_5frw.gif\" alt=\"\" width=\"960\" height=\"527\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h3>15. <a href=\"https://mycreativetype.com/\" target=\"_blank\" rel=\"noopener\">mycreativetype.com</a></h3><figure><img src=\"https://cdn-images-1.medium.com/max/800/1*aOK7YDswvH9mnI1fTHd0Og.gif\" alt=\"\" width=\"960\" height=\"528\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h2>A few fun extras</h2><ul><li><a href=\"https://www.windowsofnewyork.com/\" target=\"_blank\" rel=\"noopener\">windowsofnewyork.com</a>: an illustrated collection of New York windows.</li><li><a href=\"https://www.samuelday.de/\" target=\"_blank\" rel=\"noopener\">samuelday.de</a>: a little hard to navigate, but wonderfully creative.</li><li><a href=\"https://archive.org/\" target=\"_blank\" rel=\"noopener\">archive.org</a>: a special mention.</li><li><a href=\"https://passwordfromhell.com/\" target=\"_blank\" rel=\"noopener\">passwordfromhell.com</a>: seriously, the password from hell.</li><li><a href=\"https://super-clock.wedeserveless.com/\" target=\"_blank\" rel=\"noopener\">super-clock.wedeserveless.com</a> (watch the <a href=\"https://youtu.be/EqLSQEfaDxo\" target=\"_blank\" rel=\"noopener\">demo</a>).</li></ul>", "why-do-you-need-a-portfolio-956a51e2c31d": "<figure><img src=\"https://cdn-images-1.medium.com/max/800/1*SyfkVnlPgkfgw1aOwasBtg.png\" alt=\"\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><p>As a creator, you might be making some common portfolio mistakes, or not know where to start. Here’s what I learned building mine, and how to avoid the usual traps.</p><h2>Why I decided to build a portfolio</h2><p>In 2021, during the pandemic’s second wave, I became active on social media again and found that many people from creative backgrounds were on Twitter. A lot of people were losing jobs, and a weak professional network made finding the next one much harder. My network was weak too.</p><p>I started following people from similar backgrounds to see how they worked, shared and learned, and it gave me confidence. But it raised a new problem: what if someone asked to see my work? I had never published anything online, and I had no portfolio.</p><h2>Everyone needs a portfolio</h2><p>Today, proof of work often matters more than a degree.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/0*s7-847-cMWNrfnyH.gif\" alt=\"\" width=\"1000\" height=\"348\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><p>As an experienced designer without a portfolio, I missed freelance opportunities and probably a few good connections. Curating my work and shaping it into a decent portfolio took a lot of time and effort. Here’s what I learned along the way.</p><h2>What is a portfolio website, and do I need one?</h2><p>A portfolio website is like a professional diary: it tells people about you, your projects and your case studies, and shows your personality, experience and capabilities.</p><p>For designers, developers and creators of every kind, it’s the way to present work online and build a unique identity on the internet. Whether you’re an individual, a small team or a company, a portfolio helps you stand out from the crowd.</p><h2>What to include</h2><p>The goal is to keep visitors on your site for a few minutes while they browse your work and learn about you. Most portfolios need just a logo, what you do, your best work, an about section and contact details. You can add case studies, testimonials, writing, lessons and failures, or a project you’re working on now.</p><p>While designing it, ask yourself:</p><ul><li>Do you want to sell your services or partner with a business?</li><li>Are you looking for a job, or is it simply about you?</li></ul><p>Every project should show how you designed and delivered it. Many people fall short here, so tell the story with the right balance of words and visuals.</p><h2>Where to build it</h2><p>Whatever platform you choose, make the site easy to reach, remember and navigate. Your own domain makes it far easier to find than a link buried in an email or a chat.</p><p>Platforms worth a look: <a href=\"https://www.notion.so/\" target=\"_blank\" rel=\"noopener\">Notion</a>, <a href=\"https://peerlist.io/\" target=\"_blank\" rel=\"noopener\">Peerlist</a>, <a href=\"https://webflow.com/\" target=\"_blank\" rel=\"noopener\">Webflow</a>, <a href=\"https://www.framer.com/\" target=\"_blank\" rel=\"noopener\">Framer</a>, <a href=\"https://medium.com/\" target=\"_blank\" rel=\"noopener\">Medium</a>, <a href=\"https://dribbble.com/\" target=\"_blank\" rel=\"noopener\">Dribbble</a>, <a href=\"https://www.behance.net/\" target=\"_blank\" rel=\"noopener\">Behance</a>, <a href=\"https://portfolio.adobe.com/\" target=\"_blank\" rel=\"noopener\">Adobe Portfolio</a>, <a href=\"https://pages.github.com/\" target=\"_blank\" rel=\"noopener\">GitHub Pages</a>, <a href=\"https://substack.com/\" target=\"_blank\" rel=\"noopener\">Substack</a>, <a href=\"https://hashnode.com/\" target=\"_blank\" rel=\"noopener\">Hashnode</a>.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/0*-pP6ND41o6FpLTZZ.gif\" alt=\"\" width=\"1030\" height=\"600\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"></figure><h2>Do’s</h2><ul><li><strong>Keep it simple.</strong> Don’t overload the site. Be specific about your interests or the role you want. Use good contrast, few fonts, and light graphics and animations, and stay consistent throughout.</li><li><strong>Tell a story when it helps.</strong> Set the baseline, then walk through the process or a key feature in simple words. Put your best work first: employers review many applicants quickly.</li><li><strong>Check every device.</strong> Make sure the core information comes through on small screens.</li><li><strong>Think about SEO and privacy.</strong> Use a simple domain and relevant keywords. Password-protect NDA projects, and remember to share access when you send them.</li><li><strong>Focus on process and outcomes.</strong> You don’t need every step. Cover the problem, process, solution, outcome and business impact, with numbers where you can.</li><li><strong>No real projects yet? Make some.</strong> Join design challenges, contribute to open source, or redesign a problem you’ve noticed in an app.</li><li><strong>Polish links and assets.</strong> Clear calls to action, no broken links, easy-to-find contact details, up-to-date content, and optimised images, video and audio.</li><li><strong>Give credit.</strong> Add side work, writing, talks and learnings if you like, and always credit the teammates who helped you succeed.</li></ul><h2>Don’ts</h2><ul><li><strong>Old projects.</strong> Your portfolio should reflect who you are now. Keep it current so people can see you’re active.</li><li><strong>Obvious templates.</strong> If you use one, add your own touch so it doesn’t look like everyone else’s.</li><li><strong>Unnecessary details.</strong> Skip long skill lists, progress bars and unrelated personal information.</li><li><strong>Screenshot dumps.</strong> Even for UI or photography, give each piece some context. Communication matters.</li><li><strong>Too much text.</strong> Assume a visitor spends three to five minutes at most, and trim accordingly.</li></ul><h2>Bonus tips</h2><ul><li>If you have more than one distinct skill set, consider a separate portfolio for each.</li><li>Job hunting? Tailor the portfolio to the role you want.</li><li>Building a name? Writing and brand collaborations help you reach more people.</li><li>Looking for clients? Focus on turning visitors into leads.</li><li>Growing your network? Collaborate and work on open source projects.</li></ul><p>For great case-study writing, browse <a href=\"https://uxdesign.cc/\" target=\"_blank\" rel=\"noopener\">UX Collective</a>, <a href=\"https://uxplanet.org/\" target=\"_blank\" rel=\"noopener\">UX Planet</a>, <a href=\"https://blog.prototypr.io/\" target=\"_blank\" rel=\"noopener\">Prototypr</a>, <a href=\"https://medium.muz.li/\" target=\"_blank\" rel=\"noopener\">Muzli</a>, <a href=\"https://medium.com/design-bootcamp\" target=\"_blank\" rel=\"noopener\">Bootcamp</a>, <a href=\"https://www.casestudy.club/\" target=\"_blank\" rel=\"noopener\">Case Study Club</a>.</p><figure><img src=\"https://cdn-images-1.medium.com/max/800/0*JWZRkGwR45gMKRo5.gif\" alt=\"\" width=\"776\" height=\"436\" loading=\"lazy\" decoding=\"async\" onerror=\"this.closest('figure')?.remove()\"><figcaption>Now begin your own journey. I’d love to see it.</figcaption></figure>"};

<section class="csec"><h3>Overview</h3><p>XNProtel is a tenant app MVP designed for an Australian property company. It brings building services and automation into one place. It connects quick, physical moments, like getting through a parking gate, with longer tasks such as arranging a repair, extending a lease or booking a shared space.</p><figure class="xnhero"><img loading="lazy" decoding="async" src="${XNI.hero}" alt="Illustration of a residential community where one app connects doors, lifts, parcels, repairs and bookings"></figure></section>
<section class="csec"><span class="mono">THE BRIEF</span><h3>Make building services feel like part of home, not another chore.</h3><p>The brief asked for a tenant portal covering building services, automation and service requests. The challenge was to give time-sensitive access a clear place, while making permissions, repairs and tenancy changes easy enough to manage from a phone.</p><div class="xnps"><div><b>Tenant</b><span>Gets into the building, controls access and manages day-to-day living.</span></div><div><b>Building manager</b><span>Coordinates property requests and keeps tenants informed.</span></div><div><b>Service staff</b><span>Needs the issue, the access conditions and a suitable time to visit.</span></div></div></section>
<section class="csec"><span class="mono">THREE PRIORITIES</span><h3>What the requirements pointed to.</h3><div class="tmrf xnpr"><div><span class="mono">01</span><b>Put access first.</b><p>The mobile key was the most important function. Keep entry focused, with clear feedback and a QR fallback.</p></div><div><span class="mono">02</span><b>Make control explicit.</b><p>Doors, lifts and parking have different boundaries. Show the area, the time window and the activity instead of hiding the rules.</p></div><div><span class="mono">03</span><b>Connect the whole task.</b><p>A repair needs more than a description. Carry photos, staff access, availability and status through the journey.</p></div></div><div class="xnhmw"><span class="mono">How might we</span><b>…make the next building task easy to find, and its outcome clear?</b><p>The app is organized around moments of living: signing in, getting in, giving permission, getting help, managing a lease and using shared spaces.</p></div><div class="jump"><div><b>Short on time?</b><span>Skip straight to the app screens.</span></div><a class="btn" data-jump="f1" href="#/p/${A.id}">Show me the screens</a></div></section>

<section class="csec"><h3>Looking back</h3><p>The thread through this work is continuity: a gate, a permission window, a repair reference or a lease expiry each tell the tenant where they stand. Next, I’d test that clarity in real buildings.</p><div class="tmrf"><div><span class="mono">ACCESS</span><b>Test it at the door.</b><p>Detection, the QR fallback and “active” versus “unlocked”.</p></div><div><span class="mono">REQUESTS</span><b>Test the long form on a phone.</b><p>Photos, staff-entry consent and visit slots.</p></div><div><span class="mono">OPERATIONS</span><b>Confirm the handoffs.</b><p>Visitor codes, booking approvals and lease changes.</p></div></div></section>
<section class="xncn"><div class="xncm"><span class="mono">Conclusion</span><h3>Less guesswork in the everyday work of living.</h3><p>XNProtel connects immediate access with the slower work of running a home. The design makes actions easy to find, permissions explicit and follow-up easy to understand.</p></div><div class="xncs"><span class="mono">What I’d keep</span><ol><li><b>Prioritize the moment</b><span>Give getting in its own focused screen.</span></li><li><b>Explain the boundary</b><span>Make permissions and timing explicit.</span></li><li><b>Design the follow-through</b><span>Connect every request to its next step.</span></li></ol></div></section>

<section class="csec"><h3>Overview</h3><p>NCLEX100 is a flashcard app by Neuroflip, LLC for nurses preparing for the NCLEX, the US nursing licensing exam, with more than 4,000 cards. I designed the logo, the mobile app and the landing page, so studying, tracking progress and subscribing share one visual language.</p><p>It came from the same founder as <a href="#/p/tirimiri">Tirimiri</a>. We carried over what had worked there: a card you swipe, calm colors, and screens that ask for one thing at a time instead of everything at once.</p>${st("ov nh1",[["04","Home with today's goal"],["15","A flashcard ready for review"],["09","Leaderboard"]],"A daily goal, a quick card and a little friendly competition.")}</section>
<section class="csec"><h3>The scope</h3><p>The work covered the brand, the app and the landing page, so a decision made in one place could carry into the others.</p><div class="tmbr"><div><b>Identity</b><span>Logo, color palette and app icon.</span></div><div><b>Onboarding</b><span>Sign-in, a short intro and a daily goal.</span></div><div><b>Study experience</b><span>Decks, revision choices and swipeable flashcards.</span></div><div><b>Daily momentum</b><span>Streaks, reports and a leaderboard.</span></div><div><b>Subscription</b><span>Free trial, plans and confirmation.</span></div><div><b>Landing page</b><span>A web entry point built on the same system. ${view.replace("View landing page","View")}</span></div></div><div class="jump"><div><b>Short on time?</b><span>Skip straight to the app screens.</span></div><a class="btn" data-jump="f1" href="#/p/${A.id}">Show me the screens</a></div></section>
<section class="csec"><h3>A proven gesture, carried over.</h3><p>The card swipe had already earned its place with Tirimiri’s users, so we adapted it for flashcards: a quick, familiar gesture is a natural fit for rapid recall. <a class="nclk" href="#/p/tirimiri">Read the Tirimiri case study</a></p></section>
<section class="csec"><span class="mono">FOUNDATION</span><h3>An identity that belongs in health education.</h3><p>The caduceus-inspired mark gives NCLEX100 a clinical signal without a cold, medical look. Purple carries the study experience, while coral highlights progress and primary actions.</p><div class="tms nc brand nh1"><div class="ncbr"><div class="ncic"><img loading="lazy" decoding="async" src="${NCI["icon-dark"]}" alt="NCLEX100 app icon, dark"><img loading="lazy" decoding="async" src="${NCI["icon-light"]}" alt="NCLEX100 app icon, light"></div><div class="ncpal">${pal}</div><div class="nccp ncc1"><span>App icon · dark</span><span>App icon · light</span></div><div class="nccp ncc2">Color palette</div></div></div><p class="tmcap">App icons and the color system.</p><div class="ncln"><b>Landing page</b><p>The landing page uses the same system. The logo, purple base, coral action color and friendly illustrations connect the website to the app learners download. It was built for Neuroflip, the parent platform behind NCLEX100, so the version shown here promotes its NEET-PG app.</p>${view}</div></section>

<section class="csec"><h3>Looking back</h3><p>The main work was not adding more screens. It was using one language so every part of the product felt predictable, from a flashcard answer to a subscription plan.</p><div class="tmrf"><div><span class="mono">IDENTITY</span><b>Use a health cue with warmth.</b><p>The symbol signals healthcare, while the palette keeps the product approachable.</p></div><div><span class="mono">LEARNING</span><b>Reuse what already works.</b><p>Tirimiri's swipe made the card loop familiar from the first session.</p></div><div><span class="mono">PRODUCT</span><b>Let progress support the routine.</b><p>Streaks and reports should encourage practice, not distract from it.</p></div></div></section>
<section class="nccn"><span class="mono">Conclusion</span><h3>A study tool with one recognizable rhythm.</h3><p>NCLEX100 brought brand, product and marketing together around one simple promise: make intensive exam prep easier to approach, one card at a time.</p><div class="tmcg"><div><b>One visual system</b><span>Logo, palette, illustrations and UI work together.</span></div><div><b>One study loop</b><span>Pick a deck, swipe a card, see your progress.</span></div><div><b>One product story</b><span>The landing page and the app describe the same value.</span></div></div></section>

<section class="csec"><h3>Overview</h3><p>Tirimiri helps learners find study partners. I worked on the journey from creating a profile to browsing potential matches and starting a conversation. The app shipped and was tested with real learners.</p><p>The founder, a doctor, gave product context and feedback over calls. There was no written brief, so my role was to turn those discussions into clearer screens, then keep refining them as feedback from users came back.</p>${st("ov h2",[["subgoals","Refine study focus with sub-goals"],["swiperight","Swiping right on a study partner"],["chats","Matches and conversations"]],"Study goals, discovery and chat: the three moments this redesign connects.")}</section>

<section class="csec"><h3>After launch</h3><p>Tirimiri shipped and was tested with real learners. Usage numbers were not shared with me. Instead, what users said came back through the founder as feedback, and we improved the screens in small steps over time rather than through big redesigns.</p></section>
<section class="csec"><h3>Timeline</h3><p>The work was not continuous. It began in 2024, paused because of business and resource constraints, then resumed in 2025, when the app shipped and we refined it based on how people used it.</p><div class="tmtl"><div><span class="mono">2024 · First phase</span><b>Initial screen work</b><p>Polishing selected screens in the existing app.</p></div><div class="ps"><span class="mono">The pause</span><b>Work paused</b><p>Business and resource constraints interrupted the project.</p></div><div><span class="mono">2025 · Second phase</span><b>Shipped and refined</b><p>The app went live and was tested with learners. Feedback shaped small, steady improvements.</p></div></div></section>
<section class="csec"><h3>Looking back</h3><p>Three things I would carry into the next round. The pause made the last one obvious: when decisions from calls stay close to the work, a later phase can restart without losing context.</p><div class="tmrf"><div><span class="mono">SETUP</span><b>Make requirements earn their place.</b><p>Keep profile context useful without turning the start into a long form.</p></div><div><span class="mono">DISCOVERY</span><b>Make study goals easier to compare.</b><p>Give learners better context before they decide to connect.</p></div><div><span class="mono">PROCESS</span><b>Document decisions as they happen.</b><p>Keep call feedback and its design outcome together.</p></div></div></section>
<section class="tmcn"><div class="tmct"><div><span class="mono">Conclusion</span><h3>Polish the screens, then check how the whole path feels.</h3><p>I focused on the moments the founder wanted refined: setting up a profile, choosing study goals, reviewing a match, and starting a conversation. Together they now read as one connected path, and they kept improving after launch.</p></div><img loading="lazy" decoding="async" class="tmci" src="${TMI.cnmatch}" alt="Two study partners matched in Tirimiri"></div><div class="tmcg"><div><i>01</i><b>Keep setup light</b><span>Make profile requests clear and purposeful.</span></div><div><i>02</i><b>Support a considered match</b><span>Let study details carry some of the decision.</span></div><div><i>03</i><b>Keep the next step clear</b><span>Help a match become a comfortable first chat.</span></div></div><p class="tmds"><em>Shipped</em>Tested with real learners and refined through founder feedback.</p></section>

</svg></div>'}${cA.map(A=>`<span class="ph" style="background-image:url(${A})"></span>`).join("")}</div></div>\n <h1 class="pft">I bring clarity to complex products, with a little help from AI.</h1>\n <p class="pfp">I'm a design generalist who makes complex products clean, beautiful, and easy to use. A love of sketching grew into a career in product design, where I stay curious, explore multiple solutions, and balance user needs with business and technical realities.</p>\n <p class="pfp">I'm not a developer, but I use AI to turn ideas into working demos and prototypes, so I can test them before they become code. Once I start something I care about, I see it through.</p>\n <p class="pfp">Right now I'm exploring how AI can make products more intuitive, and I'm looking for my next design role to put that curiosity into practice.</p>\n <div class="pfc"><div class="swp"><div class="swa"><div class="mono">Open to work</div><div class="swc"><span><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18M10.5 12v2.5h3V12"/></svg>Fulltime</span><span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/></svg>Freelance</span></div></div><div class="swb"><div class="mono">Previously at</div><div class="lgs">${e.map((A,e)=>b(A[0],0,A[3])).join("")}</div></div></div></div>\n</section>`,F={ov:["Give a short overview of the product, who it was for, and what you were brought in to do.","Add a line on the constraints: team, timeline, data. Keep it honest and specific."],prom:["People already rely on digital tools for this job","The market is crowded but the experience still falls short","There is room for a clear, focused product"],pains:["Stressful, high-pressure moments","Scattered, hard-to-find information","Time-consuming manual steps"],focus:["How people do this today","Where they get stuc tion>\n <section class="csec"><h3>Key insights</h3>${F.ins.map((A,e)=>`<h4 class="sh">${e+1}. ${A[0]}</h4><p>${A[1]}</p>`).join("")}</section>\n <section class="csec"><h3>Competitive analysis</h3><p>We audited five products to see how each handles the core flow.</p><div class="chips">${F.comp.map(A=>`<span>${A}</span>`).join("")}</div><blockquote>Key observation: most tools do the first step well and the last step poorly.</blockquote></section>\n <section class="csec"><h3>From insights to POVs &amp; HMWs</h3><p>Each insight became a point-of-view statement, then a How Might We question.</p>${T(A,[2,3,4,0])}</section>\n <section class="csec"><h3>Feature strategy</h3><p>Features were chosen through the DVF lens:</p><div class="chips"><span>Desirability</span><span>Viability</span><span>Feasibility</span></div><p>Rather than isolated features, the focus was a connected system.</p></section>\n <section class="csec" id="prod"><h3>Introducing ${A.title}</h3><p>${A.blurb}</p>${O(A,4)}<span class="mono">Core features</span><div class="fl2">${F.feats.map((e,t)=>`<a class="fcard" href="#/p/${A.id}" data-jump="f${t+1}"><span class="mono">0${t+1}</span><b>${e[0]}</b><small>${e[1]}</small><i class="ar">→</i></a>`).join("")}</div></section>\n ${[0,1,2].map(e=>$(A,e)).join("")}\n <section class="csec"><h3>Impact &amp; learnings</h3><div class="stats">${A.stats.map(A=>`<div class="stat"><b>${A[0]}</b><span class="mono">${A[1]}</span></div>`).join("")}</div><p>What you would do differently next time, and the one thing this project taught you.</p></section>\n <div class="next"><a href="#/work" class="mono">← All work</a><a href="#/p/${e.id}">${e.title} →</a></div>`,AA=()=>`<div class="ffr"><div class="ffl">Krishna AR</div><div class="ffb"><i class="h tl"></i><i class="h tr"></i><i class="h bl"></i><i class="h br"></i><div class="ffp" style="background-image:url(${lA})"></div></div></div>`,eA={home:()=>eA.hb(),hb:()=>v()+U(),ha:()=>`<section class="intro0">${q()}<div class="ava">${A.a lass="pfl lb"><a class="rbtn" href="mailto:${A.email}" aria-label="Contact me by email">Contact</a><a class="rbtn" data-resume href="${A.resume||"#"}" target="_blank" rel="noopener" aria-label="View resume">Resume</a></div></div>\n <div class="pgrid" style="margin-top:36px">${[...o.filter(A=>A.id==="shellf"),...o.filter(A=>A.id!=="shellf")].map(B).join("")}</div>${j()}`,about:()=>`<div class="crumb mono stk"><a href="#/">Home</a><span class="cur pj" style="margin-left:auto">About me</span></div><h1>About<i>.</i></h1>\n <div class="abt">${AA()}<div><p class="lead">I like making complicated things feel obvious.</p><p>My process is simple: understand the problem properly, explore more than one answer, and keep refining until nothing extra is left. I care about the people using a product as much as the business behind it, and I stay realistic about what can actually be built.</p><p>Once I start something I care about, I see it through. Clean, minimal and immediately scannable is the standard I hold my own work to.</p></div></div>\n <div class="hatch" aria-hidden="true"></div>\n <h2><span>A little about my journey</span></h2><div class="jny"><p>I’m Krishna, a product designer based in Hyderabad. My journey started with sketching and a curiosity to create things. Over time, that curiosity turned into a career in design.</p>\n <div class="tlv"><div class="tli"><span class="mono">2014</span><h4>Where it started</h4><p>Design began as a hobby. I explored sketching, photography, and other creative ways to bring ideas to life.</p></div>\n <div class="tli"><span class="mono">2016</span><h4>My first creative role</h4><p>I started working as a graphic designer, experimenting with print, social media campaigns, and different creative projects. Each experience helped me understand what I enjoyed most.</p></div>\n <div class="tli"><span class="mono">2019–2020</span><h4>Finding my path</h4><p>I discovered UI/UX design and started learning Figma, exploring app ideas, and building my skills. My breakthrough came when I presented three solutions for an internship challenge, standing out among 250+ applicants.</p></div>\n <div class="tli"><span class="mono">2022</span><h4>Moving into product design</h4><p>After working across multiple projects, I wanted to get closer to product thinking and problem-solving. Freelance opportunities eventually led me to a full-time role, where I worked on complex products and data visualisation.</p></div>\n <div class="tli"><span class="mono">May 2026</span><h4>Closing a chapter</h4><p>I left my full-time role to step back and focus on personal priorities.</p></div>\n <div class="tli now"><span class="mono">Today</span><h4>Looking ahead</h4><p>I’m ready for the next chapter. I’m especially curious about AI products and agents, and how thoughtful design can turn emerging technology into useful experiences.</p></div></div>\n <div class="jtail"><h4>What connects it all?</h4><p>I’ve always learned by exploring, experimenting, and trying different approaches. That mindset continues to shape how I design, solve problems, and build products.</p></div></div>\n`,p:A=>{const e=o.findIndex(e=>e.id===A);return e<0?eA.nf():(o[e].cs||_)(o[e],(W=>W[(W.indexOf(o[e])+1)%W.length])(o))}},tA=[["Caveat + Unbounded","'Unbounded',system-ui,sans-serif","normal",500,"-.04em","d",.68,"'Caveat',cursive",700,.34],["Caveat thin","'Caveat',cursive","normal",500,"0","c",1.2,"'Caveat',cursive",400,.3]];let iA=0;const sA=e=>A.name.toLowerCase().replace("i","d"===e[5]?'<span class="di">ı</span>':'<span class="ci">i</span>');function aA(){const A=d("#nm"),e=d("#fonts");if(!A)return;const t=t=>{iA=t;const i=tA[t];A.style.fontFamily=i[1],A.style.fontStyle=i[2],A.style.fontWeight=i[3],A.style.letterSpacing=i[4],A.style.fontSize=`calc(clamp(68px,19vw,132px)*${i[6]})`;const s=A.querySelector("small");s.style.fontFamily=i[7],s.style.fontWeight=i[8],s.style.fontSize=`calc(clamp(68px,19vw,132px)*${i[9]})`,d("#nt").innerHTML=sA(i),e.querySelectorAll("button")
